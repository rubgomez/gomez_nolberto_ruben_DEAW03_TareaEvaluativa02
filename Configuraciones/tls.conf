#4 Configuración del acceso cifrado TLS
<IfModule mod_tls.c>
    # Activamos la configuración segura
    TLSEngine on
    TLSRequired on

    #Obliga a usar versiones modernas y segura
    TLSProtocol TLSv1.2 TLSv1.3
    
    # Indicamos la ubicación del certificado autofirmado
    TLSRSACertificateFile /etc/ssl/certs/servidor.pem
    # Indicamos la ubicación de la clave PRIV 
    TLSRSACertificateKeyFile /etc/ssl/private/servidor.key
    
    # Ruta de logs
    TLSLog /var/log/proftpd/tls.log     
</IfModule>