#1 Ajustes Generales
#carga todos los módulos de proftpd (Ojo! sin esto no permite usar TSL)
Include /etc/proftpd/modules.conf
#activa el móduclo TSL (Ojo! sin esto no permite usar TSL)
LoadModule mod_tls.c
#carga el fichero tls.conf (Ojo! sin esto no permite usar TSL)
Include /etc/proftpd/tls.conf
#nombre del servidor o mensaje de bienvenida
ServerName "Servidor FTP Seguro"
#inicio en 2º plano
ServerType standalone
##-s /sbin/nologin: shell sin login (solo FTP; requiere RequireValidShell off en proftpd.conf)
RequireValidShell off


#2 Conexiones 
#puerto de eschucha
Port 21
#Configuración del Modo Pasivo
PassivePorts 50000 50030
#Obliga a ProFTPD a responder con la dirección IP local (localhost)
MasqueradeAddress 127.0.0.1
#número máximo de conexiones simultáneas
MaxInstances 30

#3 Rutas y permisos
#***1: Usuario tunombre1 (FTP seguro con certificado y sin acceso a shell)
#***OJO! importante el orden
DefaultRoot /var/www/html/sitio1 rubgomez1
#Ruta por defecto
DefaultRoot ~
#Permisos a los archivos creados
#Umask 000 000 (d rwx rwx rwx) (- rw- rw- rw-)
#Umask 002 002 (d rwx rwx r-x) (- rw- rw- r--)
#Umask 022 022 (d rwx r-x r-x) (- rw- r-- r--)
Umask 022
#Permite modificar archivos existentes
AllowOverwrite on

#limita el acceso al FTP:
# daría paso sólo a los usuarios que pertenezcan al grupo"ftpgroup" (sólo a rubgomez1) 
# daría paso al usuario "ftp", es decir al usuario mapeado en la sesión anonima (Anonymous)
<Limit LOGIN>
  AllowGroup ftpgroup
  AllowUser ftp
  DenyAll
</Limit>

#cambia de identidad del root y le asigna menos privilegios
User proftpd
Group nogroup

#4 Configuración de acceso
#Define la carpeta raíz del usuario
<Anonymous /srv/ftp>
	#4.1 Ajustes Generales
	#Mapea la sesión anonima (creada por defecto por ftpd) al usuario "ftp" y grupo "ftp"
    User ftp
    Group ftp
    #Asignación interna (mapeo) del usuario anónimo al usuario "ftp" (creado por defecto por ftpd)
    UserAlias Anonymous ftp
	#Limita a un máximo de 10 usuarios
    MaxClients 10	
    #desactiva la consola
    RequireValidShell off
	#No pedir contraseña
    AnonRequirePassword off
    #Mensaje al obtener acceso (Ojo! en filezilla parece que no se ve el mensaje)
    AccessGrantMsg "Bienvenido al Servidor FTP con conexión anónima"
	
	#4.1.2 Restricciones
    #Aplica las reglas a todos los subdirectorios
    <Directory *>
    #Bloquea la accion de escritura
        <Limit WRITE>
        DenyAll
        </Limit>
    </Directory>
</Anonymous>


